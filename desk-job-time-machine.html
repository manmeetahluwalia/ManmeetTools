<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desk Job Ke 10 Saal — Body Scanner by Manmeet Ahluwalia</title>
<meta name="description" content="Slide through 10 years of a desk job, tap the body, see what the research says — and what to do about it. Free tool.">
<meta property="og:title" content="Desk Job Ke 10 Saal — Body Scanner">
<meta property="og:description" content="Slide through 10 years of sitting. Tap the body. See the research.">
<style>
  :root{
    --cream:#FFFBF3; --cream-deep:#F7ECD6; --paper-line:rgba(26,22,18,0.09);
    --ink:#201A14; --ink-soft:#4A4038;
    --terracotta:#C1440E; --terracotta-deep:#8F3308; --terracotta-pale:#FBE3D4;
    --masala:#2D5F4D; --masala-deep:#1B3D31; --masala-pale:#E1EDE6;
    --turmeric:#E8B04B; --turmeric-deep:#B9842E; --turmeric-pale:#FBF0CC;
    --ok:#5BD39A; --warn:#E8B04B; --bad:#F0623A;
    --nt-navy:#13132B; --nt-navy-deep:#0A0A1A; --nt-gold:#F2C14E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:radial-gradient(circle at 1px 1px, rgba(26,22,18,0.04) 1px, transparent 0);
    background-size:16px 16px;
    color:var(--ink);
    font-family:Georgia,'Source Serif Pro',serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; }
  .ui{ font-family:'Helvetica Neue',Arial,sans-serif; }
  .wrap{ max-width:480px; margin:0 auto; padding:0 16px 50px; }
  :focus-visible{ outline:3px solid var(--turmeric); outline-offset:2px; }

  /* ===== CREATOR BANNER ===== */
  .creator-banner{
    display:flex; align-items:center; gap:12px; padding:16px 18px;
    background:linear-gradient(135deg,var(--ink) 0%,#2b2117 100%);
    border-radius:0 0 18px 18px; box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  .creator-avatar{ width:46px;height:46px;border-radius:50%;flex-shrink:0;border:2.5px solid var(--turmeric);overflow:hidden;box-shadow:0 0 0 3px rgba(232,176,75,0.15); }
  .creator-avatar img{ width:100%;height:100%;object-fit:cover;display:block; }
  .creator-info{ flex:1; font-family:'Helvetica Neue',Arial,sans-serif; min-width:0; }
  .creator-name{ color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:5px;white-space:nowrap; }
  .creator-badge{ color:#5BC0FF;font-size:13px;flex-shrink:0; }
  .creator-handle{ color:#a89a85;font-size:11.5px;margin-top:1px; }
  .follow-btn{ background:var(--turmeric);color:var(--ink);border:none;padding:8px 17px;border-radius:20px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:11.5px;text-decoration:none;letter-spacing:.3px;flex-shrink:0; }

  /* ===== HEADER ===== */
  header{ padding:26px 0 20px; text-align:center; border-bottom:3px solid var(--ink); margin:0 0 22px; position:relative; }
  header::after{ content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:60px;height:3px;background:var(--terracotta); }
  .eyebrow{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:10.5px;letter-spacing:2.8px;text-transform:uppercase;color:var(--terracotta-deep);font-weight:700;margin-bottom:9px; }
  h1{ font-size:37px;line-height:1.02;margin:0 0 9px;font-weight:900;letter-spacing:-.8px; }
  h1 .accent{ color:var(--terracotta);font-style:italic; }
  .subhead{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:13.5px;color:var(--ink-soft);line-height:1.55;max-width:340px;margin:0 auto; }
  .lang-toggle{ display:flex;justify-content:center;margin:17px auto 0;width:fit-content;border:2px solid var(--ink);border-radius:30px;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif; }
  .lang-toggle button{ line-height:1.25;border:none;background:transparent;padding:7px 18px;font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--ink);transition:all .2s; }
  .lang-toggle button.active{ background:var(--ink);color:var(--cream); }

  /* ===== CARDS ===== */
  .card{ background:#fff;border:2px solid var(--ink);border-radius:6px;padding:20px 18px;margin-bottom:18px;box-shadow:5px 5px 0 var(--ink); }
  .card-title{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--terracotta-deep);margin-bottom:14px; }
  .field{ margin-bottom:17px; } .field:last-child{ margin-bottom:0; }
  .lbl{ display:flex;justify-content:space-between;align-items:baseline;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--masala-deep);margin-bottom:7px;gap:10px; }
  .lbl .val{ font-size:17px;letter-spacing:0;color:var(--ink);font-weight:900;text-transform:none; }
  .hint{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:#8a8074;margin:-3px 0 7px; }
  input[type=number]{ width:100%;padding:12px 14px;font-size:16px;font-family:'Helvetica Neue',Arial,sans-serif;border:2px solid var(--paper-line);border-radius:5px;background:var(--cream);color:var(--ink); }
  input[type=number]:focus{ outline:none;border-color:var(--terracotta); }

  /* ===== RANGE SLIDERS ===== */
  .rng{ -webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;display:block;touch-action:pan-y; }
  .rng::-webkit-slider-runnable-track{ height:8px;border-radius:6px;background:linear-gradient(90deg,var(--fill,#E8B04B) var(--p,0%),var(--track,rgba(255,255,255,.18)) var(--p,0%)); }
  .rng::-moz-range-track{ height:8px;border-radius:6px;background:var(--track,rgba(255,255,255,.18)); }
  .rng::-moz-range-progress{ height:8px;border-radius:6px;background:var(--fill,#E8B04B); }
  .rng::-webkit-slider-thumb{ -webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--thumb,#E8B04B);border:3px solid #fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .rng::-moz-range-thumb{ width:22px;height:22px;border-radius:50%;background:var(--thumb,#E8B04B);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .rng.light{ --track:rgba(32,26,20,.14); --fill:var(--terracotta); --thumb:var(--terracotta); }

  /* ===== SITTING MATH ===== */
  .math{ margin-top:18px;background:var(--terracotta-pale);border:2px dashed var(--terracotta);border-radius:8px;padding:15px 14px;text-align:center;font-family:'Helvetica Neue',Arial,sans-serif; }
  .math-top{ font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:var(--terracotta-deep); }
  .math-big{ font-family:Georgia,serif;font-size:42px;font-weight:900;line-height:1.1;margin:5px 0 2px;letter-spacing:-1.5px;color:var(--ink); }
  .math-big small{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:0;color:#8a6a5a;margin-left:4px; }
  .math-eq{ font-size:12.5px;line-height:1.5;color:var(--ink-soft); }
  .math-eq b{ color:var(--terracotta-deep);font-size:14px; }

  /* ===== SCANNER ===== */
  .scanner{
    position:relative;border:2px solid var(--ink);border-radius:10px;padding:14px 12px 14px;margin-bottom:18px;
    background:radial-gradient(120% 80% at 50% 0%,#2f251e 0%,#17120f 60%);
    box-shadow:5px 5px 0 var(--ink);color:#fff;overflow:hidden;
  }
  .scanner::before{ content:'';position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:22px 22px; }
  .scanner > *{ position:relative; }
  .scan-title{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--turmeric);margin-bottom:11px; }
  .seg{ display:flex;background:rgba(255,255,255,.09);border-radius:30px;padding:3px;gap:2px;font-family:'Helvetica Neue',Arial,sans-serif; }
  .seg button{ min-height:40px;flex:1;border:none;background:transparent;color:#cdbfb1;padding:10px 4px;border-radius:26px;font-size:11.5px;font-weight:800;line-height:1.15;transition:all .2s; }
  .seg button.on{ background:var(--turmeric);color:var(--ink); }
  .yr-row{ display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 2px; }
  .yr-label{ font-family:'Helvetica Neue',Arial,sans-serif;flex-shrink:0; }
  .yr-big{ display:block;white-space:nowrap;font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1; }
  .yr-age{ display:block;font-size:11px;color:#b9ab9c;margin-top:3px;letter-spacing:.3px; }
  .play{ white-space:nowrap;flex-shrink:0;line-height:1.2;border:none;background:#fff;color:var(--ink);padding:11px 15px;border-radius:24px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:12px;box-shadow:3px 3px 0 var(--turmeric);transition:transform .1s,box-shadow .1s; }
  .play:active{ transform:translate(2px,2px);box-shadow:1px 1px 0 var(--turmeric); }
  .play.pulse{ animation:nudge 1.6s ease-in-out infinite; }
  @keyframes nudge{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .ticks{ display:flex;justify-content:space-between;padding:0 12px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:9.5px;color:#9d8f81;margin-top:-1px; }

  /* stage: HUD + figure */
  .stage{ display:grid;gap:6px;align-items:center;margin-top:10px; }
  .stage.single{ grid-template-columns:1fr 150px 1fr; }
  .stage.both{ grid-template-columns:1fr 1fr; }
  .hud{ display:flex;flex-direction:column;gap:7px;min-width:0; }
  .tile{ background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:7px 8px;font-family:'Helvetica Neue',Arial,sans-serif;min-width:0; }
  .tile-l{ font-size:8.5px;letter-spacing:1.3px;color:#a99b8c;font-weight:800;text-transform:uppercase; }
  .tile-v{ font-size:13px;font-weight:900;line-height:1.2;margin-top:3px;color:#fff;word-break:break-word; }
  .tile-v.ok{ color:var(--ok); } .tile-v.warn{ color:var(--warn); } .tile-v.bad{ color:var(--bad); }
  .fig{ min-width:0; }
  .fig svg{ display:block;width:100%;height:300px; }
  .col{ min-width:0;text-align:center;font-family:'Helvetica Neue',Arial,sans-serif; }
  .cap{ font-size:11px;font-weight:900;letter-spacing:.6px;margin-top:2px; }
  .mini{ margin-top:6px;font-size:10.5px;line-height:1.45;color:#d6c9bb; }
  .mini b{ color:#fff; }
  .fig-note{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;line-height:1.45;color:#9d8f81;margin:8px 2px 0;text-align:center; }

  /* svg animation */
  .hs{ cursor:pointer; outline:none; }
  .hs-ring{ fill:none;stroke:#fff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.9s ease-out infinite; }
  .hs-dot{ fill:#fff;stroke:#201A14;stroke-width:2; transition:fill .2s; }
  .hs.on .hs-dot{ fill:#E8B04B; }
  .hs:focus-visible .hs-dot{ stroke:#E8B04B;stroke-width:3; }
  @keyframes ping{ 0%{transform:scale(.75);opacity:.95;} 100%{transform:scale(2.3);opacity:0;} }
  .heart-beat{ transform-box:fill-box;transform-origin:center;animation:beat 1.15s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{transform:scale(1);} 18%{transform:scale(1.18);} 32%{transform:scale(1);} 46%{transform:scale(1.1);} }
  .scanline{ animation:scan 3.8s linear infinite; }
  @keyframes scan{ 0%{transform:translateY(-30px);} 100%{transform:translateY(455px);} }

  /* ===== DETAIL CARD ===== */
  .detail{ margin-top:12px;border-radius:10px;background:var(--cream);color:var(--ink);border:2px solid var(--ink);overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;animation:fadein .3s ease; }
  .detail-empty{ padding:15px 14px;font-size:12.5px;line-height:1.5;color:#e9ddcf;background:rgba(255,255,255,.07);border-radius:10px;text-align:center;border:1.5px dashed rgba(255,255,255,.25); }
  .d-top{ display:flex;align-items:center;gap:9px;padding:12px 14px 4px; }
  .d-ico{ font-size:22px;line-height:1; }
  .d-title{ flex:1;font-family:Georgia,serif;font-size:16.5px;font-weight:900;line-height:1.15; }
  .d-ev{ font-size:8.5px;font-weight:900;letter-spacing:.7px;padding:4px 8px;border-radius:10px;white-space:nowrap;color:#fff; }
  .d-ev.strong{ background:var(--masala); } .d-ev.mod{ background:var(--turmeric-deep); } .d-ev.mech{ background:#7B5EA7; }
  .d-body{ padding:4px 14px 12px; }
  .d-stat{ font-family:Georgia,serif;font-size:36px;font-weight:900;letter-spacing:-1px;color:var(--terracotta);line-height:1.05;margin-top:2px; }
  .d-statlbl{ font-size:11.5px;line-height:1.4;color:var(--ink-soft);margin:2px 0 9px; }
  .d-body p{ margin:0 0 7px;font-size:12.5px;line-height:1.5; }
  .d-fix{ margin-top:10px;background:var(--masala-pale);border-left:4px solid var(--masala);padding:9px 11px;border-radius:0 7px 7px 0;font-size:12.2px;line-height:1.45; }
  .d-fix b{ display:block;font-size:9.5px;letter-spacing:1.1px;color:var(--masala-deep);margin-bottom:2px; }
  .d-src{ margin-top:8px;font-size:9.5px;color:#9a8f80;line-height:1.4; }
  .posture{ margin:6px 0 4px;background:#fff;border:1.5px solid var(--paper-line);border-radius:8px;padding:6px; }
  .posture svg{ display:block;width:100%;height:auto;max-height:190px; }
  .posture-cap{ text-align:center;font-size:10px;color:#9a8f80;margin-top:2px; }

  /* ===== COMPARE ===== */
  .cmp{ display:grid;grid-template-columns:70px 1fr 1fr;gap:6px;font-family:'Helvetica Neue',Arial,sans-serif; }
  .cmp > div{ border-radius:8px;padding:9px 8px;font-size:11.5px;line-height:1.42; }
  .cmp .h{ text-align:center;font-weight:900;font-size:11px;padding:10px 4px; }
  .cmp .h.d{ background:var(--terracotta);color:#fff; } .cmp .h.a{ background:var(--masala);color:#fff; }
  .cmp .r{ font-weight:900;font-size:10.5px;letter-spacing:.3px;color:var(--ink-soft);display:flex;align-items:center; }
  .cmp .d{ background:var(--terracotta-pale); } .cmp .a{ background:var(--masala-pale); }
  .cmp .d b{ color:var(--terracotta-deep); } .cmp .a b{ color:var(--masala-deep); }
  .cmp-note{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:10.5px;color:#8a8074;line-height:1.5;margin:11px 0 0; }

  /* ===== INDIA CHIPS ===== */
  .chips{ display:grid;gap:10px; }
  .chip{ overflow:hidden;display:flex;align-items:center;gap:13px;background:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;font-family:'Helvetica Neue',Arial,sans-serif; }
  .chip-num{ font-family:Georgia,serif;font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--terracotta);flex:0 0 auto;min-width:0;line-height:1; }
  .chip-t{ flex:1;min-width:0;font-size:12px;line-height:1.4;color:var(--ink); }
  .chip-t small{ display:block;font-size:9.5px;color:#9a8f80;margin-top:3px; }

  /* ===== FIX STEPS ===== */
  .step{ border:2px solid var(--ink);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff;font-family:'Helvetica Neue',Arial,sans-serif; }
  .step-h{ width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--cream);border:none;text-align:left;font-size:14px;font-weight:900;color:var(--ink); }
  .step-h .chev{ margin-left:auto;transition:transform .2s;font-size:12px; }
  .step.open .chev{ transform:rotate(180deg); }
  .step-b{ display:none;padding:2px 14px 14px;font-size:12.5px;line-height:1.55; }
  .step.open .step-b{ display:block; }
  .step-b p{ margin:0 0 8px; }
  .commit{ border:2px solid var(--masala);background:#fff;color:var(--masala-deep);font-weight:900;font-size:12px;padding:10px 16px;border-radius:24px;margin-top:4px; }
  .commit.on{ background:var(--masala);color:#fff; }
  .linkbtn{ display:inline-block;margin:2px 6px 6px 0;background:var(--ink);color:var(--cream);text-decoration:none;font-weight:800;font-size:11.5px;padding:9px 14px;border-radius:20px; }

  /* ===== REPORT CARD (captured as image) ===== */
  #report-wrap{ background:var(--cream);padding:14px;border-radius:6px; }
  .report{ background:linear-gradient(160deg,#241c17 0%,#14100d 100%);color:#fff;border-radius:14px;padding:20px 18px 16px;font-family:'Helvetica Neue',Arial,sans-serif;border:2px solid var(--turmeric); }
  .rp-top{ display:flex;align-items:center;gap:10px;margin-bottom:14px; }
  .rp-av{ width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid var(--turmeric);flex-shrink:0; }
  .rp-av img{ width:100%;height:100%;object-fit:cover;display:block; }
  .rp-t{ flex:1;font-size:10.5px;letter-spacing:1.6px;font-weight:900;color:var(--turmeric);text-transform:uppercase;line-height:1.3; }
  .rp-t span{ display:block;color:#a99b8c;letter-spacing:.4px;font-weight:600;text-transform:none;font-size:10.5px; }
  .rp-big{ font-family:Georgia,serif;font-size:34px;font-weight:900;line-height:1.08;letter-spacing:-1px; }
  .rp-big em{ color:var(--bad);font-style:normal;white-space:nowrap; }
  .rp-sub{ font-size:12px;color:#d6c9bb;margin:6px 0 14px;line-height:1.45; }
  .rp-grid{ display:grid;grid-template-columns:1fr 1fr;gap:8px; }
  .rp-box{ border-radius:10px;padding:10px 10px;font-size:11px;line-height:1.5; }
  .rp-box.d{ background:rgba(240,98,58,.16);border:1px solid rgba(240,98,58,.5); }
  .rp-box.a{ background:rgba(91,211,154,.14);border:1px solid rgba(91,211,154,.45); }
  .rp-box h4{ margin:0 0 5px;font-size:10px;letter-spacing:.9px;text-transform:uppercase; }
  .rp-box.d h4{ color:var(--bad); } .rp-box.a h4{ color:var(--ok); }
  .rp-plan{ margin-top:12px;font-size:11px;color:#d6c9bb;line-height:1.5; }
  .rp-plan b{ color:var(--turmeric); }
  .rp-foot{ margin-top:14px;padding-top:11px;border-top:1px dashed rgba(255,255,255,.25);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;color:#a99b8c; }
  .rp-foot b{ color:#fff;font-size:11px; }

  .action-row{ display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px; }
  .action-row > *{ min-width:0;line-height:1.25; }
  .action-btn{ display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--ink);color:var(--cream);border:none;border-radius:10px;padding:15px 8px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:12.5px;box-shadow:4px 4px 0 var(--turmeric);transition:transform .1s,box-shadow .1s; }
  .action-btn.secondary{ background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--masala); }
  .action-btn:active{ transform:translate(2px,2px);box-shadow:2px 2px 0 var(--turmeric); }
  .action-btn .aicon{ font-size:20px; }

  /* ===== CTAs / footer ===== */
  .comment-cta{ background:linear-gradient(135deg,var(--terracotta) 0%,var(--terracotta-deep) 100%);border-radius:10px;padding:18px 16px;text-align:center;margin-bottom:16px;color:#fff;font-family:'Helvetica Neue',Arial,sans-serif; }
  .cc-title{ font-weight:900;font-size:15px;margin:2px 0 6px; }
  .cc-text{ font-size:12px;line-height:1.5;color:#ffe6d8;margin-bottom:12px; }
  .cc-word{ display:inline-block;background:#fff;color:var(--terracotta-deep);font-weight:900;font-size:16px;letter-spacing:2px;padding:7px 22px;border-radius:20px; }
  .dm-cta{ background:#fff;border:2.5px dashed var(--terracotta);border-radius:10px;padding:19px 18px;text-align:center;margin-bottom:16px;font-family:'Helvetica Neue',Arial,sans-serif; }
  .dm-title{ font-weight:800;font-size:14.5px;margin:4px 0 6px; }
  .dm-text{ font-size:12px;color:#75695a;line-height:1.55;margin-bottom:13px; }
  .dm-btn{ display:inline-flex;align-items:center;gap:7px;background:var(--terracotta);color:#fff;padding:12px 23px;border-radius:30px;font-weight:800;font-size:13px;text-decoration:none; }
  details.src{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;color:var(--ink-soft);line-height:1.55;margin-top:6px;border:1.5px solid var(--paper-line);border-radius:8px;padding:10px 12px;background:#fff; }
  details.src summary{ font-weight:800;cursor:pointer;font-size:11.5px; }
  details.src ol{ margin:8px 0 0;padding-left:18px; } details.src li{ margin-bottom:5px; }
  .disclaimer{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:10.5px;color:#a89c8c;text-align:center;line-height:1.55;margin:16px 0 0;padding:0 8px; }
  .made-by{ text-align:center;margin-top:30px;padding-top:22px;border-top:2px solid var(--ink);font-family:'Helvetica Neue',Arial,sans-serif; }
  .made-by-avatar{ width:52px;height:52px;border-radius:50%;margin:0 auto 10px;border:2.5px solid var(--turmeric);overflow:hidden; }
  .made-by-avatar img{ width:100%;height:100%;object-fit:cover; }
  .mb-line1{ font-size:12px;color:#a89c8c;margin-bottom:6px; }
  .mb-handle{ display:inline-flex;font-size:15.5px;font-weight:800;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--turmeric);padding-bottom:2px; }
  .mb-sub{ font-size:11px;color:#bdb2a2;margin-top:9px; }
  .toast{ position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .25s;pointer-events:none;z-index:99999;max-width:92vw;text-align:center; }
  .toast.show{ opacity:1;transform:translateX(-50%) translateY(0); }
  @keyframes fadein{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

  /* ===== AGE NOTE ===== */
  .age-note{ margin-top:9px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--turmeric-pale);border-left:4px solid var(--turmeric-deep);padding:8px 11px;border-radius:0 7px 7px 0; }
  .age-note b{ color:var(--terracotta-deep); }
  .fuel-nt{ margin:4px 0 8px;font-size:12px;color:var(--ink-soft); }
  .fuel-nt b{ color:var(--terracotta-deep); }

  /* ===== ACCOUNTABILITY + NATURALTEIN ===== */
  .ac-intro{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 13px; }
  .ac-row{ margin-bottom:11px; }
  .ac-lbl{ font-family:'Helvetica Neue',Arial,sans-serif;font-size:11.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;color:var(--ink); }
  .ac-days{ display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px; }
  .ac-day{ height:40px;border:2px solid var(--ink);border-radius:9px;background:var(--cream);color:#9a8f80;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:800;padding:0;transition:background .15s,transform .1s; }
  .ac-day:active{ transform:scale(.94); }
  .ac-day.on{ color:#fff;font-size:17px; }
  .ac-day.w.on{ background:var(--masala);border-color:var(--masala-deep); }
  .ac-day.p.on{ background:var(--terracotta);border-color:var(--terracotta-deep); }
  .ac-foot{ display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;font-weight:800;color:var(--masala-deep); }
  .ac-reset{ background:none;border:none;color:#9a8f80;font-size:11px;text-decoration:underline;padding:6px 0 6px 10px; }
  .natural-promo{ background:linear-gradient(160deg,var(--nt-navy) 0%,var(--nt-navy-deep) 100%);border-radius:12px;border:1.5px solid rgba(242,193,78,.4);overflow:hidden;position:relative; }
  .natural-promo::before{ content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(242,193,78,.12) 0%,transparent 70%);pointer-events:none; }
  .np-top{ display:flex;align-items:center;justify-content:space-between;padding:15px 15px 0;position:relative;z-index:1; }
  .nt-logo{ display:flex;align-items:center;gap:7px; }
  .nt-logo-mark{ width:26px;height:26px;border-radius:6px;background:var(--nt-gold);display:flex;align-items:center;justify-content:center; }
  .nt-logo-mark svg{ width:16px;height:16px; }
  .nt-logo-text{ font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:13px;color:#fff;letter-spacing:.3px; }
  .nt-logo-text .sub{ display:block;font-size:6.8px;color:#8a8aa8;font-weight:700;letter-spacing:1.3px;margin-top:-1px; }
  .np-badge{ background:var(--nt-gold);color:var(--nt-navy-deep);font-family:'Helvetica Neue',Arial,sans-serif;font-size:8.5px;font-weight:900;padding:4px 9px;border-radius:10px;letter-spacing:.5px; }
  .np-body{ padding:12px 15px 15px;position:relative;z-index:1; }
  .np-text{ color:#c9c9e0;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11.5px;line-height:1.55;margin:0 0 12px; }
  .np-text b{ color:var(--nt-gold); }
  .np-coupon{ display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.35);border-radius:8px;padding:11px 14px;border:1.5px dashed var(--nt-gold);margin-bottom:11px; }
  .np-coupon-label{ color:#8a8aa8;font-family:'Helvetica Neue',Arial,sans-serif;font-size:9.5px;display:block; }
  .np-coupon-code{ color:var(--nt-gold);font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:17px;letter-spacing:1.5px;display:block; }
  .np-coupon-save{ background:var(--nt-gold);color:var(--nt-navy-deep);font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:900;padding:6px 12px;border-radius:20px; }
  .np-cta{ display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--nt-gold);color:var(--nt-navy-deep);padding:13px;border-radius:8px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:13px;text-decoration:none; }

  /* ===== HORIZON TOGGLE ===== */
  .hz{ display:flex;gap:6px;margin-top:13px; }
  .hz button{ flex:1;border:2px solid var(--terracotta);background:#fff;color:var(--terracotta-deep);font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:11.5px;line-height:1.2;padding:9px 4px;border-radius:22px;transition:all .15s; }
  .hz button.on{ background:var(--terracotta);color:#fff; }
  .hz-note{ margin-top:8px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;color:#8a6a5a;line-height:1.4; }

  /* ===== NATURALTEIN STRIP ===== */
  .nt-strip{ display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,var(--nt-navy) 0%,var(--nt-navy-deep) 100%);border:1.5px solid rgba(242,193,78,.45);border-radius:12px;padding:12px;margin-bottom:18px;font-family:'Helvetica Neue',Arial,sans-serif;box-shadow:4px 4px 0 var(--ink); }
  .nts-mark{ width:30px;height:30px;border-radius:7px;background:var(--nt-gold);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .nts-mark svg{ width:18px;height:18px; }
  .nts-t{ flex:1;min-width:0;color:#b9b9d6;font-size:10.5px;line-height:1.35; }
  .nts-t b{ display:block;font-size:12.5px;font-weight:900;color:#fff;margin-bottom:1px; }
  .nts-actions{ display:flex;flex-direction:column;gap:5px;flex-shrink:0; }
  .nts-code{ background:rgba(0,0,0,.35);border:1.5px dashed var(--nt-gold);color:var(--nt-gold);font-family:inherit;font-weight:900;font-size:12px;letter-spacing:1px;padding:6px 9px;border-radius:8px; }
  .nts-code small{ font-size:8px;letter-spacing:.4px;color:#b9b9d6;font-weight:700; }
  .nts-go{ background:var(--nt-gold);color:var(--nt-navy-deep);font-weight:900;font-size:11px;text-align:center;text-decoration:none;padding:6px 9px;border-radius:8px; }

  @media (max-width:370px){
    h1{ font-size:31px; }
    .stage.single{ grid-template-columns:1fr 128px 1fr; }
    .fig svg{ height:262px; }
    .tile-v{ font-size:12px; }
    .cmp{ grid-template-columns:58px 1fr 1fr; }
  }
  @media (prefers-reduced-motion:reduce){
    .hs-ring,.heart-beat,.scanline,.play.pulse{ animation:none; }
  }
</style>
</head>

  if(age<=an[0][0]) return an[0][idx];
  for(let i=1;i<an.length;i++){ if(age<=an[i][0]){ const a=an[i-1], b=an[i], f=(age-a[0])/(b[0]-a[0]); return a[idx]+(b[idx]-a[idx])*f; } }
  return an[an.length-1][idx];
}
function accrue(t, rateFn){                       // integrate a per-decade rate over t years, starting at S.age

  return sum;
}
function metrics(t){
  const yo  = accrue(t, a => a>=30 ? 10 : 0);    // years of the window that fall at age >= 30
  const mLo = accrue(t, a => a>=30 ? interp(MUSCLE_ANCHORS,a,1) : 0);
  const mHi = accrue(t, a => a>=30 ? interp(MUSCLE_ANCHORS,a,2) : 0);
  const vo  = accrue(t, a => a>=30 ? interp(VO2_ANCHORS,a,1) : 0);
  return { yo, mLo, mHi, mMid:(mLo+mHi)/2, vo, voAct:vo*VO2_TRAINED_FACTOR, sitHrs:S.hours*365*t };
}
/* Sitting-hours horizons. "ten" is a fixed 10-year window (depends only on hours/day) — which is exactly why it never
   moved with age. "sofar" and "career" DO depend on age: assumes career started at 22 and retirement at 60,
   with the same hours every day. */
const CAREER_START = 22, RETIRE_AGE = 60;
function sitSpan(){ return S.hz==='sofar' ? Math.max(0, S.age-CAREER_START) : (S.hz==='ten' ? 10 : Math.max(0, RETIRE_AGE-S.age)); }
function hzRange(){ return S.hz==='sofar' ? [CAREER_START, Math.max(CAREER_START,S.age)] : (S.hz==='ten' ? [S.age, S.age+10] : [S.age, Math.max(S.age,RETIRE_AGE)]); }
function sitMath(){
  const span=sitSpan(), hours = S.hours*365*span;
  return { hours, yrs: hours/8760, pct: Math.round(S.hours/16*100), span };   // 16 waking hours assumed
}
function hzLabel(){ return T('lbl_'+S.hz); }

function smooth(pts, closed){
  const n=pts.length, get=i=>pts[((i%n)+n)%n];
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  const last = closed ? n : n-1;
  for(let i=0;i<last;i++){
    const p0=closed?get(i-1):pts[Math.max(i-1,0)], p1=get(i), p2=closed?get(i+1):pts[i+1], p3=closed?get(i+2):pts[Math.min(i+2,n-1)];
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=' C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+' '+c2[0].toFixed(1)+' '+c2[1].toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d+(closed?'Z':'');
}

function countUp(el, to, dec, suffix){
  const done = () => { el.textContent = (dec? to.toFixed(dec) : Math.round(to)) + suffix; };
  if(REDUCED || typeof requestAnimationFrame!=='function'){ done(); return; }
  const t0=performance.now(), dur=1100;
  const step = now => { const p=clamp((now-t0)/dur,0,1), e=1-Math.pow(1-p,3); el.textContent=(dec?(to*e).toFixed(dec):Math.round(to*e))+suffix; if(p<1) requestAnimationFrame(step); else done(); };
  requestAnimationFrame(step);
}

  const defs=[ {n:R.inactiveIndia, dec:1, suf:'%', t:T('chip1',{x:R.inactiveIndia2000}), s:T('chip1s')},

               {n:R.itPain, dec:0, suf:'%', t:T('chip3'), s:T('chip3s')} ];
  $('#chips').innerHTML = defs.map((c,i)=>'<div class="chip"><div class="chip-num" id="cn'+i+'">'+(S.chipsDone?(c.dec?c.n.toFixed(c.dec):c.n)+c.suf:'0'+c.suf)+'</div><div class="chip-t">'+c.t+'<small>'+c.s+'</small></div></div>').join('');
  if(S.chipsDone) return;
  const run=()=>{ if(S.chipsDone) return; S.chipsDone=true; defs.forEach((c,i)=>countUp($('#cn'+i), c.n, c.dec, c.suf)); };
  if(typeof IntersectionObserver==='function'){
    const io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ run(); io.disconnect(); } },{threshold:.4});
    io.observe($('#chips'));
  } else { run(); }
}

    const open = S.openStep===d[0], on=S.picks.has(d[0]);
    const links = d[0]==='fuel' ? '<a class="linkbtn" href="'+TOOL1_URL+'" target="_blank" rel="noopener">'+T('tool1')+'</a><a class="linkbtn" href="'+TOOL2_URL+'" target="_blank" rel="noopener">'+T('tool2')+'</a><br><p class="fuel-nt">'+T('st_fuel_nt')+'</p>' : '';
    return '<div class="step'+(open?' open':'')+'" data-step="'+d[0]+'"><button class="step-h" onclick="toggleStep(\''+d[0]+'\')">'+T(d[1])+'<span class="chev">▼</span></button>'
      +'<div class="step-b">'+T(d[2])+links+'<button class="commit'+(on?' on':'')+'" onclick="togglePick(\''+d[0]+'\')">'+(on?T('committed'):T('commit'))+'</button></div></div>';
  }).join('');
}
function toggleStep(id){ S.openStep = (S.openStep===id) ? null : id; renderSteps(); }
function togglePick(id){
  if(S.picks.has(id)) S.picks.delete(id); else { S.picks.add(id); showToast(T('plan_toast')); }
  renderSteps(); renderReport();
}

function reportUrl(){
  if(location.protocol==='http:' || location.protocol==='https:') return (location.host+location.pathname).replace(/index\.html$/,'');
  return '@_manmeet.ahluwalia_';
}
function renderReport(){
  const m=metrics(10), sm=sitMath();
  const dm = m.yo<=0.01 ? T('notyet') : T('mus_loss',{lo:f1(m.mLo),hi:f1(m.mHi)});
  const dc = m.yo<=0.01 ? T('notyet') : '≈ −'+f1(m.vo)+'%';
  const names={ move:'Move', lift:'Lift', fuel:'Fuel' };
  const plan = S.picks.size ? ['move','lift','fuel'].filter(k=>S.picks.has(k)).map(k=>names[k]).join(' · ') : T('rp_plan_none');
  $('#report').innerHTML=
   '<div class="rp-top"><div class="rp-av"><img src="'+document.querySelector('.creator-avatar img').src+'" alt=""></div>'
   +'<div class="rp-t">'+T('rp_title')+'<span>'+T('rp_sub',{a:hzRange()[0],b:hzRange()[1],h:S.hours})+'</span></div></div>'
   +'<div class="rp-big">'+T('rp_big',{yrs:f1(sm.yrs),lbl:hzLabel()})+'</div>'
   +'<div class="rp-sub">'+T('rp_hrs',{hrs:fmtN(sm.hours),pct:sm.pct})+'</div>'
   +'<div class="rp-grid"><div class="rp-box d"><h4>'+T('rp_d')+'</h4>'+T('rp_mus')+': <b>'+dm+'</b><br>'+T('rp_car')+': <b>'+dc+'</b><br>'+T('rp_t2d',{n:R.t2d})+'</div>'
   +'<div class="rp-box a"><h4>'+T('rp_a')+'</h4>'+T('rp_a_mus')+'<br>'+T('rp_a_car')+'<br>'+T('rp_a_sit')+'</div></div>'
   +'<div class="rp-plan">'+T('rp_plan')+' <b>'+plan+'</b></div>'
   +'<div class="rp-plan">'+T('rp_fuel')+'</div>'
   +(ACCT.filter(Boolean).length>0 ? '<div class="rp-plan">'+T('rp_acct',{n:ACCT.filter(Boolean).length})+'</div>' : '')
   +'<div class="rp-foot"><span>'+T('rp_foot')+' <b>'+reportUrl()+'</b></span><span>@_manmeet.ahluwalia_</span></div>'
   +'<div style="margin-top:8px;font-size:9px;color:#8f8173">'+T('rp_note')+'</div>';
}

function renderSources(){ $('#src-list').innerHTML = SOURCES.map(s=>'<li>'+s+'</li>').join(''); }

function renderAll(){
  applyStatic(); renderMath(); renderAgeNote(); renderStage(); renderDetail(); updatePlayBtn(); renderCompare(); renderChips(); renderSteps(); renderAcct(); renderReport(); renderSources();
  $('#cc-word').textContent = COMMENT_WORD;
  $('#lang-hi').classList.toggle('active', S.lang==='hi'); $('#lang-en').classList.toggle('active', S.lang==='en');
  FIGS.forEach(f => f.setSelected(S.sel));
}

/* ============================ AGE NOTE ============================ */
function renderAgeNote(){
  const el=$('#age-note'); if(!el) return;
  const m=metrics(10);
  if(m.yo<=0.01){ el.innerHTML=T('an_none',{a:S.age,b:S.age+10}); return; }
  let h=T('an_txt',{a:S.age,b:S.age+10,lo:f1(m.mLo),hi:f1(m.mHi),vo:f1(m.vo)});
  if(m.yo<9.95) h+=T('an_part',{y:f1(m.yo)});
  el.innerHTML=h;
}

/* ============================ ACCOUNTABILITY TRACKER ============================ */
const ACCT_KEY='djtm_acct_v1';
function loadAcct(){ try{ const v=JSON.parse(localStorage.getItem(ACCT_KEY)||'null'); if(Array.isArray(v) && v.length===14) return v.map(Boolean); }catch(e){} return new Array(14).fill(false); }
function saveAcct(){ try{ localStorage.setItem(ACCT_KEY, JSON.stringify(ACCT)); }catch(e){} }
let ACCT = loadAcct();      // [0..6] = workout D1..D7, [7..13] = protein D1..D7
function renderAcct(){
  const host=$('#acct'); if(!host) return;
  const rows=[ {ico:'🏋️', lbl:T('ac_workout'), off:0, cls:'w'}, {ico:'🍗', lbl:T('ac_protein'), off:7, cls:'p'} ];
  host.innerHTML = rows.map(r=>{
    let b='';
    for(let i=0;i<7;i++){ const idx=r.off+i, on=ACCT[idx];
      b+='<button class="ac-day '+r.cls+(on?' on':'')+'" aria-pressed="'+(on?'true':'false')+'" aria-label="'+r.lbl+' D'+(i+1)+'" onclick="toggleAcct('+idx+')">'+(on?'✓':'D'+(i+1))+'</button>'; }
    return '<div class="ac-row"><div class="ac-lbl">'+r.ico+' '+r.lbl+'</div><div class="ac-days">'+b+'</div></div>';
  }).join('');
  const n=ACCT.filter(Boolean).length;
  $('#ac-count').innerHTML='<span>'+T('ac_count',{n:n})+'</span><button class="ac-reset" onclick="resetAcct()">'+T('ac_reset')+'</button>';
}
function toggleAcct(i){
  ACCT[i]=!ACCT[i]; saveAcct(); renderAcct(); renderReport();
  if(ACCT.every(Boolean)) showToast(T('ac_done'));
}
function resetAcct(){ ACCT=new Array(14).fill(false); saveAcct(); renderAcct(); renderReport(); }

/* ============================ INTERACTION ============================ */
function setLang(l){ S.lang=l; renderAll(); }
const NT_CODE = 'MSA15';
function copyCode(){
  const done=()=>showToast(T('code_copied'));
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){ navigator.clipboard.writeText(NT_CODE).then(done).catch(()=>legacyCopyCode()); return; }
  legacyCopyCode();
}
function legacyCopyCode(){
  const ta=document.createElement('textarea'); ta.value=NT_CODE; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  if(ok) showToast(T('code_copied')); else window.prompt(T('copy_prompt'), NT_CODE);
}
function setHz(k){ S.hz=k; renderMath(); renderReport(); }
function setView(v){
  S.view=v;
  ['desk','active','both'].forEach(k => $('#v-'+k).classList.toggle('on', k===v));
  renderStage(); renderDetail(); FIGS.forEach(f => f.setSelected(S.sel));
}
function setT(t, fromSlider){
  S.t = clamp(t,0,10);
  if(!fromSlider) $('#yr').value = S.t;
  updateVisuals(); updatePlayBtn();
}
function pause(){ S.playing=false; cancelAnimationFrame(S.raf); updatePlayBtn(); }
function play(dur){
  cancelAnimationFrame(S.raf);
  $('#play-btn').classList.remove('pulse');
  const from = S.t>=9.95 ? 0 : S.t;
  if(REDUCED){ setT(10); return; }
  const total = Math.max(250, (10-from)/10*(dur||7000));
  S.playing=true; updatePlayBtn();
  const t0=performance.now();
  const step = now => {
    if(!S.playing) return;
    const p=clamp((now-t0)/total,0,1), e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    setT(from+(10-from)*e);
    if(p<1) S.raf=requestAnimationFrame(step);
    else { S.playing=false; updatePlayBtn(); showToast(T('t_end')); }
  };
  S.raf=requestAnimationFrame(step);
}
function togglePlay(){ if(S.playing) pause(); else play(); }

function wireInputs(){
  $('#yr').addEventListener('input', e => { if(S.playing) pause(); setT(parseFloat(e.target.value), true); });
  $('#hrs').addEventListener('input', e => { S.hours=parseInt(e.target.value,10)||9; renderMath(); renderReport(); updateVisuals(); });
  const ageEl=$('#age');
  ageEl.addEventListener('input', () => { const v=parseInt(ageEl.value,10); if(v>=18 && v<=60){ S.age=v; renderMath(); renderAgeNote(); renderCompare(); renderReport(); updateVisuals(); } });
  ageEl.addEventListener('change', () => { let v=parseInt(ageEl.value,10); if(isNaN(v)) v=30; v=clamp(v,18,60); ageEl.value=v; S.age=v; renderMath(); renderAgeNote(); renderCompare(); renderReport(); updateVisuals(); });
}

/* ============================ SHARE / SAVE ============================ */
let toastTimer=0;
function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function shareResult(){
  const sm=sitMath();
  const text=T('share_text',{yrs:f1(sm.yrs),lbl:hzLabel()});
  const url=(location.protocol==='file:') ? IG_URL : location.href;
  if(navigator.share){
    navigator.share({ title:'Desk Job Ke 10 Saal — by Manmeet Ahluwalia', text:text, url:url })
      .then(()=>showToast(T('t_shared'))).catch(e=>{ if(e && e.name==='AbortError') return; legacyCopy(text+' '+url); });
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(text+' '+url).then(()=>showToast(T('t_copied'))).catch(()=>legacyCopy(text+' '+url));
    return;
  }
  legacyCopy(text+' '+url);
}
function legacyCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  if(ok) showToast(T('t_copied')); else window.prompt(T('copy_prompt'), txt);
}
function isMobileDevice(){ return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent); }
function saveAsImage(){
  if(typeof html2canvas==='undefined'){ showToast(T('t_nolib')); return; }
  showToast(T('t_prep'));
  html2canvas($('#report-wrap'),{ backgroundColor:'#FFFBF3', scale:2, useCORS:true }).then(canvas=>{
    canvas.toBlob(blob=>{
      if(!blob){ showToast(T('t_fail')); return; }
      const name='desk-job-report-manmeet-ahluwalia.png';
      const file=new File([blob],name,{type:'image/png'});
      const dataUrl=canvas.toDataURL('image/png');
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'Desk Job Ke 10 Saal'}).then(()=>showToast(T('t_shared'))).catch(e=>{ if(e && e.name==='AbortError') return; showImageModal(dataUrl); });
        return;
      }
      if(!isMobileDevice()){
        const u=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(u),4000); showToast(T('t_dl')); return;
      }
      showImageModal(dataUrl);
    },'image/png');
  }).catch(()=>showToast(T('t_fail')));
}
function showImageModal(dataUrl){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;';
  const ins=document.createElement('div'); ins.style.cssText="color:#fff;font-family:'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:700;text-align:center;max-width:320px;line-height:1.5;"; ins.textContent=T('modal_ins');
  const img=document.createElement('img'); img.src=dataUrl; img.style.cssText='max-width:100%;max-height:65vh;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);';
  const btn=document.createElement('button'); btn.textContent=T('modal_close'); btn.style.cssText="background:#E8B04B;color:#201A14;border:none;padding:12px 28px;border-radius:30px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:13px;cursor:pointer;";
  btn.onclick=()=>document.body.removeChild(ov);
  ov.appendChild(ins); ov.appendChild(img); ov.appendChild(btn); document.body.appendChild(ov);
}

/* ============================ INIT ============================ */
wireInputs();
renderAll();
</script>
